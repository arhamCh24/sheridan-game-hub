<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#092c5a" />
    <title>Hardware Challenge | Sheridan Game Hub</title>
    <link rel="icon" href="../../assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/main.css" />
    <link rel="stylesheet" href="./hardware.css" />
    <script type="module" src="./hardware.js"></script>
  </head>
  <body class="game-page hardware-page">
    <div class="demo-notice" id="modeNotice" hidden></div>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="../../index.html"
          ><img
            class="brand-logo"
            src="../../assets/sheridan-logo.webp"
            alt=""
            width="46"
            height="46"
          /><span class="brand-text"
            ><strong>SHERIDAN</strong
            ><span
              >GAME HUB <span class="brand-dot">•</span> OPEN HOUSE</span
            ></span
          ></a
        >
        <div class="header-actions">
          <a class="header-link" href="../../index.html">← All games</a>
          <div id="playerWidget" class="player-widget"></div>
        </div>
      </div>
    </header>
    <main id="hardwareApp" class="shell hc-main" aria-live="polite">
      <div class="hc-loading">Loading Hardware Challenge…</div>
    </main>
    <div id="modalRoot"></div>
    <div
      id="toastRoot"
      class="toast-root"
      role="status"
      aria-live="polite"
    ></div>
  </body>
</html>
